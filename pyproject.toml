[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcast"
version = "0.1.0"
description = "Learning-series Kalman filter for intraday theme-park attendance nowcasting"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "matplotlib", "sqlalchemy", "holidays"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
nowcast = ["schema.sql"]
